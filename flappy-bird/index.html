<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird | Skybound</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <main class="page">
    <header>
      <a href="../index.html">← Back to Arcade</a>
      <h1>🐦 Flappy Bird</h1>
      <p>Tap the game, click, or press Space to flap</p>
    </header>
    <section class="scoreboard" aria-label="Scoreboard">
      <div><span>Score</span><strong id="score">0</strong></div>
      <div><span>Best</span><strong id="highScore">0</strong></div>
      <div><span>Last</span><strong id="lastScore">0</strong></div>
    </section>
    <section class="game-card">
      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="640" height="600"></canvas>
        <div id="message" class="message"><b id="messageTitle">READY?</b><span id="messageText">Press Start or Space to begin</span></div>
      </div>
      <button id="startBtn">Start Game</button>
    </section>
  </main>
  <script src="script.js?v=3"></script>
</body>
</html>
